<!DOCTYPE html>
<html>
<head>
    <title>Animated Registration Page</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, #00adb5, #007b83, #005f6b, #003f44);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 1s ease;
        }

        @keyframes slideDown {
            from {transform: translateY(-100%);}
            to {transform: translateY(0);}
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            position: relative;
        }

        nav a::after {
            content: "";
            width: 0%;
            height: 2px;
            background: #00fff7;
            position: absolute;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 60px 20px;
            color: white;
            animation: fadeIn 2s ease;
        }

        .hero h1 {
            font-size: 42px;
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0% {transform: translateY(0);}
            50% {transform: translateY(-10px);}
            100% {transform: translateY(0);}
        }

        /* ===== FORM ===== */
        .form-section {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeUp 1.5s ease;
        }

        @keyframes fadeUp {
            from {opacity: 0; transform: translateY(40px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .form-container h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00adb5;
            box-shadow: 0 0 8px #00adb5;
            outline: none;
        }

        .password-box {
            position: relative;
        }

        .toggle-pass {
            position: absolute;
            right: 10px;
            top: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #007b83;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .strength {
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #007b83;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 15px;
            color: white;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @media (max-width: 600px) {
            .form-container {
                width: 90%;
            }
        }

    </style>
</head>

<body>

<header>
    <h2>Rakesh Web</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Register</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Join Our Platform 🚀</h1>
    <p>Create your account and start your journey</p>
</section>

<section class="form-section">
    <div class="form-container">
        <h2>Register</h2>

        <form onsubmit="return validateForm()">

            <input type="text" id="name" placeholder="Full Name">
            <div id="nameError" class="error"></div>

            <input type="email" id="email" placeholder="Email">
            <div id="emailError" class="error"></div>

            <input type="text" id="phone" placeholder="Phone Number">
            <div id="phoneError" class="error"></div>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password">
                <span class="toggle-pass" onclick="togglePassword()">Show</span>
            </div>
            <div id="passwordError" class="error"></div>
            <div id="strengthText" class="strength"></div>

            <button type="submit">Register Now</button>

        </form>
    </div>
</section>

<footer>
    © 2026 Rakesh | All Rights Reserved
</footer>

<script>

function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById("password").addEventListener("input", function() {
    let strength = document.getElementById("strengthText");
    let value = this.value;

    if (value.length < 6) {
        strength.innerHTML = "Weak password";
        strength.style.color = "red";
    } else if (value.match(/[A-Z]/) && value.match(/[0-9]/)) {
        strength.innerHTML = "Strong password";
        strength.style.color = "green";
    } else {
        strength.innerHTML = "Medium password";
        strength.style.color = "orange";
    }
});

function validateForm() {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value.trim();

    document.getElementById("nameError").innerHTML = "";
    document.getElementById("emailError").innerHTML = "";
    document.getElementById("phoneError").innerHTML = "";
    document.getElementById("passwordError").innerHTML = "";

    let valid = true;

    if (name.length < 3) {
        document.getElementById("nameError").innerHTML = "Name must be at least 3 characters";
        valid = false;
    }

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        document.getElementById("emailError").innerHTML = "Enter valid email";
        valid = false;
    }

    let phonePattern = /^[0-9]{10}$/;
    if (!phone.match(phonePattern)) {
        document.getElementById("phoneError").innerHTML = "Phone must be 10 digits";
        valid = false;
    }

    if (password.length < 6) {
        document.getElementById("passwordError").innerHTML = "Password must be at least 6 characters";
        valid = false;
    }

    if (valid) {
        alert("Registration Successful 🎉");
    }

    return valid;
}

</script>

</body>
</html>
